<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 160" role="img" aria-label="Pipeline: JSON source of truth, validated, tailored without fabricating, autofit and rendered, to DOCX and PDF">
  <defs>
    <style>
      .box { fill: #131927; stroke: rgba(255, 255, 255, 0.12); stroke-width: 1.5; rx: 12; }
      .box-highlight { fill: rgba(99, 102, 241, 0.12); stroke: #6366f1; stroke-width: 2; rx: 12; }
      .label { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 14px; font-weight: 600; fill: #f8fafc; text-anchor: middle; }
      .sub { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: #94a3b8; text-anchor: middle; }
      .arrow { stroke: #6366f1; stroke-width: 2; marker-end: url(#arrowhead); }
      .icon { stroke: #38bdf8; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6366f1" />
    </marker>
  </defs>

  <!-- Step 1: JSON Source -->
  <g>
    <rect class="box" x="10" y="35" width="150" height="80" />
    <text class="label" x="85" y="70">JSON Source</text>
    <text class="sub" x="85" y="90">of truth</text>
  </g>
  <line class="arrow" x1="160" y1="75" x2="195" y2="75" />

  <!-- Step 2: Validate -->
  <g>
    <rect class="box" x="200" y="35" width="150" height="80" />
    <text class="label" x="275" y="70">Validate</text>
    <text class="sub" x="275" y="90">best-effort schema</text>
  </g>
  <line class="arrow" x1="350" y1="75" x2="385" y2="75" />

  <!-- Step 3: Tailor with Resume & Scissors Icon -->
  <g>
    <rect class="box-highlight" x="390" y="30" width="180" height="90" />
    <!-- Resume + Scissors Icon -->
    <g transform="translate(405, 52)">
      <path class="icon" d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h6"/>
      <polyline class="icon" points="14 2 14 8 20 8"/>
      <line class="icon" x1="8" y1="7" x2="11" y2="7"/>
      <line class="icon" x1="8" y1="11" x2="16" y2="11"/>
      <line class="icon" x1="8" y1="15" x2="12" y2="15"/>
      <circle class="icon" cx="15.5" cy="19.5" r="1.5"/>
      <circle class="icon" cx="19.5" cy="19.5" r="1.5"/>
      <path class="icon" d="M16.5 18.5L20 13"/>
      <path class="icon" d="M18.5 18.5L15 13"/>
    </g>
    <text class="label" x="495" y="65">Honest Tailor</text>
    <text class="sub" x="495" y="83">rephrase &amp; select</text>
    <text class="sub" x="495" y="97">zero fabricated facts</text>
  </g>
  <line class="arrow" x1="570" y1="75" x2="605" y2="75" />

  <!-- Step 4: Autofit -->
  <g>
    <rect class="box" x="610" y="35" width="140" height="80" />
    <text class="label" x="680" y="70">Smart Autofit</text>
    <text class="sub" x="680" y="90">1-page engine</text>
  </g>
  <line class="arrow" x1="750" y1="75" x2="785" y2="75" />

  <!-- Step 5: Output -->
  <g>
    <rect class="box" x="790" y="35" width="100" height="80" />
    <text class="label" x="840" y="70">DOCX</text>
    <text class="sub" x="840" y="90">+ PDF</text>
  </g>
</svg>
