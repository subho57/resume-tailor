name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "src/render.ts"
      - "src/theme.ts"
      - "src/validate.ts"
      - "src/types.ts"
      - "schema/**"
      - "themes/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install root dependencies
        run: bun install

      - name: Install and build site/
        working-directory: site
        run: |
          bun install
          bun run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

      - id: deployment
        uses: actions/deploy-pages@v5
