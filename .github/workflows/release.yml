name: Release binaries

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # Determines whether the commits since the last release warrant a new one
  # (Conventional Commits: fix:/feat:/BREAKING CHANGE, via @semantic-release/commit-
  # analyzer), and if so: bumps package.json's version, writes CHANGELOG.md, commits
  # both back to main with [skip ci] (so this doesn't retrigger the workflow), tags,
  # and creates the GitHub Release (no binary assets yet — those need the version
  # this job just decided on, so they're built and attached in the jobs below).
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      published: ${{ steps.semantic.outputs.new_release_published }}
      version: ${{ steps.semantic.outputs.new_release_version }}
      tag: ${{ steps.semantic.outputs.new_release_git_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install

      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v6
        with:
          extra_plugins: |
            @semantic-release/changelog
            @semantic-release/git
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Cross-compiles build-resume for every target from this single Linux runner (bun
  # build --compile downloads the target platform's Bun runtime, it doesn't need to
  # run on that OS). Only runs when the release job actually published something, and
  # checks out main *after* that job's version-bump commit, so each binary's embedded
  # --version matches the release it belongs to.
  build:
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bun-linux-x64
            binaryName: build-resume
            archiveName: build-resume-linux-x64.tar.gz
          - target: bun-linux-arm64
            binaryName: build-resume
            archiveName: build-resume-linux-arm64.tar.gz
          - target: bun-darwin-x64
            binaryName: build-resume
            archiveName: build-resume-macos-x64.tar.gz
          - target: bun-darwin-arm64
            binaryName: build-resume
            archiveName: build-resume-macos-arm64.tar.gz
          - target: bun-windows-x64
            binaryName: build-resume.exe
            archiveName: build-resume-windows-x64.zip
          - target: bun-windows-arm64
            binaryName: build-resume.exe
            archiveName: build-resume-windows-arm64.zip
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install

      - name: Generate embedded skill bundle
        run: bun run prepare-skill

      - name: Compile ${{ matrix.target }}
        run: |
          mkdir -p dist-bin
          bun build --compile --target=${{ matrix.target }} --outfile=dist-bin/${{ matrix.binaryName }} ./src/cli.ts

      # Archive here, before actions/upload-artifact, not after: tar/zip's own
      # format stores the Unix executable bit in its per-entry header, so it
      # survives the upload-artifact/download-artifact round trip intact even
      # though that round trip is known to drop the *outer* file's own permission
      # bit (see the `attach` job below) — the archive file itself doesn't need
      # +x, only `build-resume` inside it does, and that's preserved by tar's own
      # metadata rather than anything artifact-related.
      - name: Archive ${{ matrix.target }}
        run: |
          cd dist-bin
          if [[ "${{ matrix.archiveName }}" == *.zip ]]; then
            zip "${{ matrix.archiveName }}" "${{ matrix.binaryName }}"
          else
            chmod +x "${{ matrix.binaryName }}"
            tar -czf "${{ matrix.archiveName }}" "${{ matrix.binaryName }}"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.archiveName }}
          path: dist-bin/${{ matrix.archiveName }}
          if-no-files-found: error

  # Attaches the 6 archives + a checksum manifest onto the release the `release` job
  # already created (gh release upload, not create — the release exists already).
  attach:
    needs: [release, build]
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      # No chmod-restoring step needed here: the `build` job archives each binary
      # into a .tar.gz/.zip *before* actions/upload-artifact, and tar/zip's own
      # per-entry permission metadata survives the upload/download-artifact round
      # trip even though that round trip is known to drop the executable bit on a
      # raw (unarchived) file. Extracting the archive restores +x on the binary
      # inside — no manual `chmod +x` needed by end users either, unlike the old
      # raw-binary assets.

      - name: Generate checksums
        run: |
          cd artifacts
          find . -type f -exec sha256sum {} \; | sed 's#\./[^/]*/#/#' > ../SHA256SUMS.txt
          cd ..
          cat SHA256SUMS.txt

      - name: Attach binaries to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ needs.release.outputs.tag }}" \
            artifacts/*/* SHA256SUMS.txt \
            --repo "${{ github.repository }}"
